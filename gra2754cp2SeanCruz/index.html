<!DOCTYPE HTML>

<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>SVG Animations Using CSS</title>
<style>
body{
	margin:0;
	padding:0;
	background-color:#CCC;
	}
wrapper{
	width:100%;
	max-width:1024px;
	margin:0 auto;
	display:block;
	}
header{
	height:150px;
	background-color:#19B5E3;
	}
main{
	height:768px;
	background-color:#FFF;
	padding:4em 0;
	box-sizing:border-box;
	text-align:center;
	}
footer{
	height:80px;
	background-color:#19B5E3;
	clear:both;
	}
	#Fighters{animation: moving 8s infinite linear;
	}
	@keyframes moving{
		0%{transform: translateX(-900px);}
		100%{transform: translateX(1200px);}
	}
	
	#Fightersize{animation: size 8s infinite linear; }
	@keyframes size{
		0%{transform: scale(.4);}
		100%{transform: scale(.4);}
	}
	
	#Back{animation: updown 2s infinite alternate;}
	@keyframes updown{
		0%{transform: translateY(100px);}
		100%{transform: translateY(-200px);}
	}
	
	#Middle{animation: downup 2s infinite alternate;}
	@keyframes downup{
		0%{transform: translateY(-100px);}
		100%{transform: translateY(200px);}
	}
		
	}
	
</style>
</head>
